<html lang="th">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
tailwind.config={theme:{extend:{fontFamily:{display:['"Noto Serif Thai"','serif'],body:['Sarabun','sans-serif']},colors:{lacquer:{50:'#FDF2F2',100:'#F6E4E1',500:'#8A2424',700:'#5C1414',900:'#3D0F0F'},brass:{100:'#F3E9D2',300:'#DEC58F',500:'#C5A059',700:'#8C6A1F'},teak:{50:'#FBF7EF',100:'#D9CFC2',200:'#C5B9A8',300:'#A6957F',400:'#8A7260',500:'#6B5740',700:'#4A3825',900:'#2A1E14'},jade:{100:'#E3EBE3',500:'#4A7A5A',700:'#2F4538'}}}}}

<style>
*{box-sizing:border-box;}
body{font-family:'Sarabun',sans-serif;}
.font-display{font-family:'Noto Serif Thai',serif;}

/* Sidebar */
#sidebar{transition:transform .3s cubic-bezier(.34,1.1,.64,1);}
#sidebar-overlay{transition:opacity .3s;}

/* Progress bar fill animation */
.prog-fill{transition:width 1.2s cubic-bezier(.4,0,.2,1);}

/* Tab underline */
.tab-line{position:absolute;bottom:0;height:2px;background:#5C1414;border-radius:1px;
  transition:left .3s cubic-bezier(.34,1.26,.64,1),width .3s cubic-bezier(.34,1.26,.64,1);}

/* Card hover */
.hover-lift{transition:box-shadow .15s,transform .2s cubic-bezier(.34,1.36,.64,1);}
.hover-lift:hover{box-shadow:0 8px 24px rgba(42,30,20,.10);transform:translateY(-2px);}

/* Notification badge pulse */
@keyframes pulse-dot{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.pulse-dot{animation:pulse-dot 1.8s ease-in-out infinite;}

/* Modal */
#modal-overlay{transition:opacity .2s;}
#modal-box{transition:transform .3s cubic-bezier(.34,1.26,.64,1),opacity .2s;}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#2A1E14;color:#DEC58F;padding:12px 24px;border-radius:999px;
  font-size:14px;font-weight:500;z-index:999;display:flex;align-items:center;gap:8px;
  transition:transform .35s cubic-bezier(.34,1.26,.64,1),opacity .3s;opacity:0;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* Donut chart */
.donut{transform:rotate(-90deg);}
.donut-track{fill:none;stroke:#D9CFC2;stroke-width:8;}
.donut-fill{fill:none;stroke:#5C1414;stroke-width:8;stroke-linecap:round;
  stroke-dasharray:0 283;transition:stroke-dasharray 1.4s cubic-bezier(.4,0,.2,1);}

/* Waveform */
.wv{display:inline-block;width:3px;border-radius:2px;background:#C5A059;margin:0 1px;vertical-align:middle;}

/* Calendar day */
.cal-day{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
.cal-day:hover{background:#F3E9D2;}
.cal-day.today{background:#5C1414;color:#DEC58F;font-weight:700;}
.cal-day.has-event{position:relative;}
.cal-day.has-event::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#C5A059;}

/* Role switcher */
.role-btn{padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s;}
.role-btn.active{background:#5C1414;color:#DEC58F;border-color:#5C1414;}
.role-btn.inactive{background:#fff;color:#6B5740;border-color:#D9CFC2;}
.role-btn.inactive:hover{border-color:#C5A059;}
</style>
</head>
<body class="bg-teak-50 text-teak-900">

<!-- ══ SIDEBAR OVERLAY (mobile) ══════════════════════════════════════ -->
<div id="sidebar-overlay" class="fixed inset-0 bg-teak-900/50 z-30 hidden opacity-0" onclick="closeSidebar()"></div>

<!-- ══ SIDEBAR ═══════════════════════════════════════════════════════ -->

<!-- ══ MAIN WRAPPER ═══════════════════════════════════════════════════ -->
<div class="lg:ml-64 min-h-screen flex flex-col">

  <!-- ── TOP NAVBAR ─────────────────────────────────────────────────── -->
  <header class="bg-white border-b border-teak-100 sticky top-0 z-20">
    <div class="px-4 sm:px-6 h-16 flex items-center justify-between">

      <!-- Hamburger (mobile) -->
      <button onclick="openSidebar()" class="lg:hidden w-9 h-9 flex flex-col justify-center items-center gap-1.5 rounded-lg hover:bg-teak-50 transition-colors">

  <!-- ── CONTENT ─────────────────────────────────────────────────────── -->

  </main>

</div>

<div id="modal-overlay" class="fixed inset-0 bg-teak-900/50 z-50 hidden opacity-0 flex items-end sm:items-center justify-center p-4" onclick="closeModal()">
  <div id="modal-box" class="bg-white rounded-2xl w-full max-w-md max-h-[85vh] overflow-hidden shadow-2xl scale-95 opacity-0" onclick="event.stopPropagation()">

      <h3 class="font-display font-bold text-base text-teak-900" id="modal-title">Modal</h3>
      <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-lg border border-teak-100 text-teak-400 hover:text-lacquer-700 hover:border-lacquer-700 transition-colors">✕</button>

</div>

<script>
// ══════════════════════════════════════════════════════════════════════

// ══ STATE ══════════════════════════════════════════════════════════
let currentRole = 'student';
let activeTab   = 'overview';

// ══ SIDEBAR ════════════════════════════════════════════════════════
const MENUS = {
  student:[
    {id:'overview', icon:'📊', label:'ภาพรวม'},
    {id:'lessons',  icon:'📖', label:'บทเรียนของฉัน'},
    {id:'calendar', icon:'📅', label:'ปฏิทินและนัดหมาย'},
    {id:'quiz',     icon:'📝', label:'แบบทดสอบ'},
  ],
  teacher:[
    {id:'overview',  icon:'📊', label:'ภาพรวม'},
    {id:'classroom', icon:'🏫', label:'จัดการชั้นเรียน'},
    {id:'students',  icon:'👥', label:'รายชื่อนักเรียน'},
    {id:'calendar',  icon:'📅', label:'ปฏิทินและนัดหมาย'},
  ]
};

function renderSidebar(){
  const d=DATA[currentRole];
  document.getElementById('sb-name').textContent=d.name;
  document.getElementById('sb-role-label').textContent=d.role;
  document.getElementById('sb-avatar').textContent=d.avatar;
  document.getElementById('nav-avatar').textContent=d.avatar;

  const menu=document.getElementById('sidebarMenu');
  menu.innerHTML=MENUS[currentRole].map(m=>`
    <button onclick="setTab('${m.id}')" id="menu-${m.id}"
      class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg text-left text-sm font-medium transition-colors
             ${activeTab===m.id ? 'bg-lacquer-700 text-brass-300' : 'text-teak-300 hover:bg-teak-700 hover:text-white'}">
      <span class="text-base">${m.icon}</span>${m.label}
    </button>`).join('');
}

function openSidebar(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay');
  sb.classList.remove('-translate-x-full'); ov.classList.remove('hidden');
  requestAnimationFrame(()=>ov.classList.remove('opacity-0'));
}
function closeSidebar(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('sidebar-overlay');
  sb.classList.add('-translate-x-full'); ov.classList.add('opacity-0');
  setTimeout(()=>ov.classList.add('hidden'),300);
}

// ══ ROLE SWITCH ════════════════════════════════════════════════════
function switchRole(role){
  currentRole=role; activeTab='overview';
  document.getElementById('rb-student').className='role-btn '+(role==='student'?'active':'inactive');
  document.getElementById('rb-teacher').className='role-btn '+(role==='teacher'?'active':'inactive');
  renderSidebar(); renderContent();
  showToast('สลับเป็น Dashboard '+DATA[role].role,'✓');
}

// ══ TAB ════════════════════════════════════════════════════════════
function setTab(id){
  activeTab=id; renderSidebar(); renderContent();
  closeSidebar();
}

// ══ RENDER CONTENT ════════════════════════════════════════════════
function renderContent(){
  const main=document.getElementById('mainContent');
  if(currentRole==='student'){
    if(activeTab==='overview')  { main.innerHTML=studentOverview(); animateProgress(); }
    if(activeTab==='lessons')   { main.innerHTML=studentLessons(); }
    if(activeTab==='calendar')  { main.innerHTML=renderCalendar(); }
    if(activeTab==='quiz')      { main.innerHTML=studentQuiz(); }
  } else {
    if(activeTab==='overview')  { main.innerHTML=teacherOverview(); }
    if(activeTab==='classroom') { main.innerHTML=teacherClassroom(); }
    if(activeTab==='students')  { main.innerHTML=teacherStudents(); }
    if(activeTab==='calendar')  { main.innerHTML=renderCalendar(); }
  }

  const tmap={overview:'ภาพรวม',lessons:'บทเรียนของฉัน',calendar:'ปฏิทินและนัดหมาย',quiz:'แบบทดสอบ',classroom:'จัดการชั้นเรียน',students:'รายชื่อนักเรียน'};
  document.getElementById('pageTitle').textContent=tmap[activeTab]||'Dashboard';
  document.getElementById('pageSubtitle').textContent=activeTab==='overview'?'ภาพรวมการเรียนของคุณ':' ';
}

// ══ HELPERS ════════════════════════════════════════════════════════
function diffLabel(d){ return ['','เริ่มต้น','ปานกลาง','สูง'][d]; }
function diffBadge(d){
  const cls=[,'bg-jade-100 text-jade-700','bg-brass-100 text-brass-700','bg-lacquer-100 text-lacquer-700'][d]||'bg-teak-100 text-teak-500';
  return `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${cls}">${diffLabel(d)}</span>`;
}
function statusIcon(s){ return {completed:'✅',in_progress:'🔄',not_started:'⬜'}[s]||'⬜'; }
function statusLabel(s){ return {completed:'เสร็จแล้ว',in_progress:'กำลังเรียน',not_started:'ยังไม่เริ่ม'}[s]||''; }
function progColor(pct){ return pct===100?'#4A7A5A':pct>0?'#5C1414':'#D9CFC2'; }

function progressBar(pct, id='', h='h-2'){
  return `<div class="w-full bg-teak-100 rounded-full ${h} overflow-hidden">
    <div class="prog-fill ${h} rounded-full" id="${id}" style="width:0%;background:${progColor(pct)};--target:${pct}%"></div>
  </div>`;
}

function animateProgress(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.prog-fill').forEach(el=>{
      const t=el.style.getPropertyValue('--target')||el.getAttribute('data-pct')+'%';
      el.style.width=t;
    });
  }));
}

// ══ STUDENT: OVERVIEW ══════════════════════════════════════════════
function studentOverview(){
  const d=DATA.student;
  const totalPct=Math.round((d.stats.completed/d.stats.total)*100);
  const circumference=2*Math.PI*40; // r=40
  const dash=(totalPct/100)*circumference;

  return `
  <!-- Stats strip -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
    ${[
      {label:'เรียนจบแล้ว', val:d.stats.completed, unit:'บท', color:'text-jade-700', bg:'bg-jade-100'},
      {label:'กำลังเรียน',  val:d.stats.inProgress, unit:'บท', color:'text-brass-700', bg:'bg-brass-100'},
      {label:'ยังไม่เริ่ม', val:d.stats.notStarted, unit:'บท', color:'text-teak-400', bg:'bg-teak-100'},
      {label:'ทั้งหมด',     val:d.stats.total, unit:'บท', color:'text-lacquer-700', bg:'bg-lacquer-100'},
    ].map(s=>`
      <div class="bg-white border border-teak-100 rounded-xl p-4 hover-lift">
        <div class="w-9 h-9 ${s.bg} rounded-lg flex items-center justify-center mb-3 font-bold ${s.color} text-base">${s.val}</div>
        <p class="text-xs text-teak-400">${s.label}</p>
        <p class="font-semibold text-sm text-teak-900 mt-0.5">${s.val} ${s.unit}</p>

// ══ CALENDAR ════════════════════════════════════════════════════
function renderCalendar(){
  const d=DATA[currentRole];
  const days=['อา','จ','อ','พ','พฤ','ศ','ส'];
  // July 2026 starts on Wednesday (index 3)
  const startDay=3, totalDays=31;
  let cells=[];
  for(let i=0;i<startDay;i++) cells.push(`<div></div>`);
  for(let day=1;day<=totalDays;day++){
    const ev=d.events.find(e=>e.day===day);
    const isToday=day===12;
    cells.push(`
      <div class="cal-day ${isToday?'today':''} ${ev?'has-event':''}" onclick="${ev?`showToast('${ev.title} · ${ev.time}','📅')`:''}">
        ${day}
      </div>`);
  }

  return `
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
    <!-- Calendar -->
    <div class="lg:col-span-2 bg-white border border-teak-100 rounded-xl p-5">
      <div class="flex items-center justify-between mb-4">
        <p class="font-display font-bold text-sm text-teak-900">กรกฎาคม 2569</p>
        <div class="flex gap-1">
          <button class="w-7 h-7 rounded-lg border border-teak-100 text-teak-400 hover:border-lacquer-700 hover:text-lacquer-700 transition-colors text-sm">‹</button>
          <button class="w-7 h-7 rounded-lg border border-teak-100 text-teak-400 hover:border-lacquer-700 hover:text-lacquer-700 transition-colors text-sm">›</button>
        </div>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-2">
        ${days.map(d=>`<div class="text-center text-xs text-teak-400 font-medium py-1">${d}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-1">${cells.join('')}</div>
      <div class="flex items-center gap-4 mt-4 pt-4 border-t border-teak-100 text-xs text-teak-400">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-lacquer-700 inline-block"></span> วันนี้</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-brass-500 inline-block"></span> มีกิจกรรม</span>
      </div>
    </div>

    <!-- Event list -->
    <div class="bg-white border border-teak-100 rounded-xl p-5">
      <p class="font-display font-bold text-sm text-teak-900 mb-4">กิจกรรมเดือนนี้</p>
      <div class="flex flex-col gap-3">
        ${d.events.map(e=>`
          <div class="flex gap-3 p-3 rounded-lg hover:bg-teak-50 transition-colors cursor-pointer" onclick="showToast('${e.title}','📅')">
            <div class="w-10 shrink-0 text-center">
              <p class="font-bold text-lacquer-700 text-lg leading-none">${e.day}</p>
              <p class="text-xs text-teak-400">ก.ค.</p>
            </div>
            <div class="flex-1 border-l border-teak-100 pl-3">
              <p class="text-sm font-semibold text-teak-900">${e.title}</p>
              <p class="text-xs text-teak-400 mt-0.5">⏰ ${e.time}</p>
            </div>
          </div>`).join('')}
      </div>
      <button onclick="showToast('เปิดฟอร์มเพิ่มกิจกรรม','➕')"
        class="w-full mt-4 border border-dashed border-teak-200 hover:border-lacquer-700 text-teak-400 hover:text-lacquer-700 rounded-lg py-2.5 text-sm font-medium transition-colors">

// ══ MODAL ═════════════════════════════════════════════════════════
function openModal(type){
  const overlay=document.getElementById('modal-overlay');
  const box=document.getElementById('modal-box');
  overlay.classList.remove('hidden');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    overlay.classList.remove('opacity-0');
    box.classList.remove('scale-95','opacity-0');
  }));

  if(type==='notif'){
    document.getElementById('modal-title').textContent='การแจ้งเตือน';
    const notifs=DATA[currentRole].notifications;
    const unread=notifs.filter(n=>!n.read).length;
    document.getElementById('modal-body').innerHTML=`
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm text-teak-400">ยังไม่อ่าน <span class="font-bold text-lacquer-700">${unread}</span> รายการ</p>
        <button onclick="markAllRead()" class="text-xs text-lacquer-700 underline underline-offset-2">ทำเครื่องหมายอ่านทั้งหมด</button>
      </div>
      <div class="flex flex-col gap-2" id="notifList">
        ${notifs.map(n=>`
          <div id="notif-${n.id}" class="flex gap-3 p-3 rounded-xl cursor-pointer transition-colors ${n.read?'bg-white border border-teak-100':'bg-lacquer-50 border border-lacquer-100'}"
               onclick="readNotif(${n.id})">
            <div class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center text-lg
              ${n.read?'bg-teak-100':'bg-lacquer-100'}">${n.icon}</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-semibold text-teak-900 truncate">${n.title}</p>
              <p class="text-xs text-teak-500 mt-0.5 line-clamp-2">${n.body}</p>
              <p class="text-xs text-teak-300 mt-1">${n.time}</p>
            </div>
            ${!n.read?'<span class="w-2 h-2 bg-lacquer-700 rounded-full shrink-0 mt-1.5"></span>':''}
          </div>`).join('')}
      </div>`;
  }
}

function closeModal(){
  const overlay=document.getElementById('modal-overlay');
  const box=document.getElementById('modal-box');
  overlay.classList.add('opacity-0');
  box.classList.add('scale-95','opacity-0');
  setTimeout(()=>overlay.classList.add('hidden'),250);
}

function readNotif(id){
  const n=DATA[currentRole].notifications.find(x=>x.id===id);
  if(n&&!n.read){ n.read=true; openModal('notif'); }
}
function markAllRead(){
  DATA[currentRole].notifications.forEach(n=>n.read=true);
  openModal('notif'); showToast('อ่านทั้งหมดแล้ว','✓');
}

// ══ TOAST ═════════════════════════════════════════════════════════
function showToast(msg,icon='✓'){
  const t=document.getElementById('toast');
  document.getElementById('ti').textContent=icon;
  document.getElementById('tm').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ══ INIT ══════════════════════════════════════════════════════════
renderSidebar();
renderContent();

// Animate donut on render
function animateDonut(){
  const el=document.getElementById('donutFill');
  if(!el)return;
  const dash=el.getAttribute('data-dash');
  const circ=el.getAttribute('data-circ');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.setAttribute('stroke-dasharray',`${dash} ${circ}`);
  }));
}

const origRender=renderContent;
window.renderContent=function(){
  origRender();
  setTimeout(()=>{ animateProgress(); animateDonut(); },50);
};
renderContent();
</script>
</body>
</html>
